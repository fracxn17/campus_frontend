services:
  - type: web
    name: campuslegacy-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/campuslegacy.db
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
